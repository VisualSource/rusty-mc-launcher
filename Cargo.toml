[workspace]
resolver = "3"
members = [
   "packages/app", "packages/launcher-content","packages/launcher-core", "packages/launcher-process", "packages/plugin-query"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Collin Blosser"]
repository = "https://github.com/VisualSource/rusty-mc-launcher"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.10.0", features = ["serde"] }
tauri = { version = "2.6.1", default-features = false }
tokio = { version = "1.44.0", features = ["sync"]}
tokio-util = "0.7.15"
thiserror = "2.0.12"
log = "0.4.27"
time = "0.3.39"
normalize-path = "0.2.1"
os_info = { version = "3", default-features = false }
lazy-regex = "3.4.1"
lenient_semver = "0.4.2"

# dev dependencies
env_logger = "0.11"

[profile.release]
strip = true  # Remove debug symbols
opt-level = "s"  # Optimize for binary size
lto = true  # Enables link to optimizations
codegen-units = 1 # Compile crates one after another so the compiler can optimize better

[profile.dev.package.sqlx-macros]
opt-level = 3


